<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JOVI — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="toasts"></div>

<div class="overlay" id="m-forgot">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('m-forgot')">✕</button>
    <h2>Recuperar Senha</h2>
    <p>Informe seu e-mail e enviaremos um link de redefinição.</p>
    <div class="field"><label>E-mail</label><input type="email" id="f-email" placeholder="seu@email.com"/></div>
    <button class="btn" onclick="handleForgot()">ENVIAR LINK</button>
  </div>
</div>

<div class="overlay" id="m-register">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('m-register')">✕</button>
    <h2>Criar Conta</h2>
    <p>Bem-vindo ao ecossistema JOVI.</p>
    <div class="field"><label>Nome</label><input type="text" id="r-name" placeholder="João Silva"/></div>
    <div class="field"><label>E-mail</label><input type="email" id="r-email" placeholder="seu@email.com"/></div>
    <div class="field"><label>Senha</label><input type="password" id="r-pass" placeholder="••••••••"/></div>
    <button class="btn" onclick="handleRegister()">CRIAR CONTA</button>
  </div>
</div>
